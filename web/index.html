<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SheepStealer Engine</title>
<style>
  :root { --bg:#f5f7fa; --card:#fff; --text:#1c2430; --muted:#5b6675; --line:#d9dfe7; --accent:#1f4e79; --err:#b3261e; --code:#f1f4f8; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#12161c; --card:#1b212a; --text:#e8ecf1; --muted:#9aa5b4; --line:#2e3744; --accent:#6aa6e0; --err:#ff8a80; --code:#141a21; }
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:16px/1.5 system-ui, sans-serif; }
  header, main { max-width:1100px; margin:0 auto; padding:0 16px; }
  header { padding-top:24px; padding-bottom:8px; }
  h1 { margin:0; font-size:1.6rem; color:var(--accent); }
  header p { margin:4px 0 0; color:var(--muted); }
  main { display:grid; grid-template-columns:1fr 1fr; gap:16px; padding-bottom:32px; }
  @media (max-width:800px) { main { grid-template-columns:1fr; } }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:16px; }
  label { display:block; font-size:.85rem; color:var(--muted); margin:10px 0 4px; }
  select, textarea, button { font:inherit; color:var(--text); }
  select { width:100%; padding:8px; border:1px solid var(--line); border-radius:8px; background:var(--card); }
  .row { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  textarea { width:100%; height:300px; padding:10px; border:1px solid var(--line); border-radius:8px; background:var(--code);
             font:13px/1.45 ui-monospace, Consolas, monospace; resize:vertical; white-space:pre; overflow:auto; }
  button { margin-top:12px; padding:10px 18px; border:0; border-radius:8px; background:var(--accent); color:#fff; font-weight:600; cursor:pointer; }
  button:disabled { opacity:.6; cursor:wait; }
  #status { margin:0 0 10px; color:var(--muted); min-height:1.5em; }
  #error { color:var(--err); font-weight:600; white-space:pre-wrap; }
  #pic { display:block; width:100%; height:auto; border-radius:8px; background:var(--code); min-height:120px; }
  #dl { display:none; margin-top:10px; color:var(--accent); font-weight:600; }
</style>
</head>
<body>
<header>
  <h1>SheepStealer Engine</h1>
  <p>A ray tracer written in C++. Edit the scene text, press Render, get a picture.</p>
</header>
<main>
  <section class="card">
    <label for="example">Example scene</label>
    <select id="example"></select>
    <div class="row">
      <div><label for="size">Picture size</label>
        <select id="size">
          <option value="320x180">Small (320 x 180)</option>
          <option value="480x270" selected>Medium (480 x 270)</option>
          <option value="640x360">Large (640 x 360)</option>
        </select></div>
      <div><label for="quality">Quality (smooth edges)</label>
        <select id="quality">
          <option value="4">Fast</option>
          <option value="8" selected>Normal</option>
          <option value="16">High</option>
        </select></div>
    </div>
    <label for="scene">Scene file</label>
    <textarea id="scene" spellcheck="false"></textarea>
    <button id="go">Render</button>
  </section>
  <section class="card">
    <p id="status">Pick an example and press Render.</p>
    <p id="error"></p>
    <img id="pic" alt="Rendered picture will appear here">
    <a id="dl" download="sheepstealer.png">Download PNG</a>
  </section>
</main>
<script>
const $ = (id) => document.getElementById(id);
let examples = [];

async function loadExamples() {
  try {
    const res = await fetch('/api/examples');
    examples = await res.json();
  } catch (e) { examples = []; }
  $('example').innerHTML = examples.map((x, i) => '<option value="' + i + '">' + x.name + '</option>').join('');
  if (examples.length) $('scene').value = examples[0].scene;
}

$('example').addEventListener('change', () => {
  $('scene').value = examples[Number($('example').value)].scene;
});

async function render() {
  const [w, h] = $('size').value.split('x').map(Number);
  $('go').disabled = true;
  $('error').textContent = '';
  $('status').textContent = 'Rendering...';
  const started = performance.now();
  try {
    const res = await fetch('/api/render', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ scene: $('scene').value, width: w, height: h, spp: Number($('quality').value) })
    });
    if (!res.ok) {
      let msg = 'Render failed (' + res.status + ').';
      try { msg = (await res.json()).error || msg; } catch (e) {}
      $('error').textContent = msg;
      $('status').textContent = 'Fix the scene and try again.';
      return;
    }
    const blob = await res.blob();
    const url = URL.createObjectURL(blob);
    $('pic').src = url;
    $('dl').href = url;
    $('dl').style.display = 'inline-block';
    $('status').textContent = 'Done in ' + ((performance.now() - started) / 1000).toFixed(1) + ' s';
  } catch (e) {
    $('error').textContent = 'Could not reach the server.';
    $('status').textContent = '';
  } finally {
    $('go').disabled = false;
  }
}

$('go').addEventListener('click', render);
loadExamples();
</script>
</body>
</html>
